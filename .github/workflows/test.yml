name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Headless suites
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-4.7.2-linux

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v4.7.2-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      - name: Import assets
        run: |
          echo "$HOME/godot" >> "$GITHUB_PATH"
          "$HOME/godot/godot" --headless --path . --import 2>&1 | tail -5

      # Not just "did the tests pass": a script error mid-test still prints
      # FAILURES=0, so run.sh treats errors and parser warnings as failures too.
      - name: Run the suites
        run: ./test/run.sh

      # GUT runs three of the same suites ported to its idiom. It fails on an
      # engine error structurally, rather than by grepping for one.
      - name: Run the GUT suites
        run: ./test/run_gut.sh
