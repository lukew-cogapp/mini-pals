name: Publish web build

# Tags, not every push: a half-finished build should never replace the one
# people have the link to. `git tag v1 && git push --tags`, or use the
# "Run workflow" button.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    name: Export and publish to itch.io
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          lfs: false

      - name: Export web build
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./
          cache: true
          presets_to_export: Web

      # A Godot web export can "succeed" and produce nothing playable, and it
      # prints no error when it does. Fail here rather than shipping a black
      # screen, and print the size breakdown so it is a number, not a guess.
      - name: Check the build exists and report its size
        run: |
          DIR="${{ steps.export.outputs.build_directory }}/Web"
          test -f "$DIR/index.html" || { echo "::error::no index.html in $DIR"; ls -R "$DIR"; exit 1; }
          echo "Total: $(du -sh "$DIR" | cut -f1)"
          du -h "$DIR"/* | sort -rh

      - name: Publish to itch.io
        uses: yeslayla/butler-publish-itchio-action@v1.2.0
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: html5
          ITCH_GAME: mini-pals
          ITCH_USER: ${{ vars.ITCH_USER }}
          PACKAGE: ${{ steps.export.outputs.build_directory }}/Web
