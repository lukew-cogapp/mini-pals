name: Publish web build

# Tags, not every push: a half-finished build should never replace the one
# people have the link to. `git tag v1 && git push --tags`, or use the
# "Run workflow" button.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Pages needs these to deploy, and only one deployment at a time.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: Export the web build
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          lfs: false

      # The renderer needs no change: Godot 4.7 forces gl_compatibility on the
      # web through rendering_method.web, so Forward Plus in project.godot
      # applies to desktop only. Overriding it here is what breaks the build.
      - name: Export web build
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./
          cache: true
          presets_to_export: Web

      # A Godot web export can "succeed" and produce nothing playable, and it
      # prints no error when it does. Fail here rather than publishing a black
      # screen, and print the size so it is a number rather than a guess.
      - name: Check the build exists and report its size
        run: |
          DIR="${{ steps.export.outputs.build_directory }}/Web"
          test -f "$DIR/index.html" || { echo "::error::no index.html in $DIR"; ls -R "$DIR"; exit 1; }
          echo "Total: $(du -sh "$DIR" | cut -f1)"
          du -h "$DIR"/* | sort -rh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.export.outputs.build_directory }}/Web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
